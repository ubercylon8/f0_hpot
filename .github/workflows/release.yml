name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # zizmor[artipacked]: the checkout's credentials are not needed past this step;
          # action-gh-release publishes via the API with its own token input.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: agent/go.mod
          # This workflow publishes signed artifacts: a poisoned module cache could
          # reach them. Cold builds are cheap; cache stays off here (CI keeps it).
          cache: false

      - name: Build + cross-compile
        working-directory: agent
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"

      - name: Install signing tools
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Sign release manifest
        working-directory: agent
        env:
          RELEASE_ED25519_KEY: ${{ secrets.RELEASE_ED25519_KEY }}
        run: |
          echo "$RELEASE_ED25519_KEY" > release.key
          chmod 600 release.key
          ./sign_release.sh release.key bin/f0-deception-agent-*
          # Raw 32-byte public key, base64 — consumed by the self-check below.
          echo "F0_RELEASE_PUB_B64=$(openssl pkey -in release.key -pubout -outform DER | tail -c 32 | base64 -w0)" >> "$GITHUB_ENV"
          rm release.key

      - name: Verify signature (self-check)
        working-directory: agent
        run: |
          # Fail the release if the signed manifest doesn't verify against
          # the agent's own canonicalization + verifier.
          go test ./internal/update/ -run TestOpensslSignedManifest -v

      - name: Package
        working-directory: agent
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd bin
          sha256sum f0-deception-agent-* release-manifest.json > SHA256SUMS
          cd ..
          tar -czf "f0-deception-agent-$VERSION-linux-amd64.tar.gz" \
            -C bin f0-deception-agent-linux-amd64 release-manifest.json

      - name: Publish GitHub Release
        # zizmor: ignore[superfluous-actions]
        # `gh release create` could replace this, but the action's glob handling and
        # generate_release_notes are in use and battle-tested here; keep the pin.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            agent/bin/f0-deception-agent-*
            agent/bin/release-manifest.json
            agent/bin/SHA256SUMS
