name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build + cross-compile
        working-directory: agent
        run: make release VERSION=${{ github.ref_name }}

      - name: Install signing tools
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Sign release manifest
        working-directory: agent
        env:
          RELEASE_ED25519_KEY: ${{ secrets.RELEASE_ED25519_KEY }}
        run: |
          echo "$RELEASE_ED25519_KEY" > release.key
          chmod 600 release.key
          ./sign_release.sh release.key bin/f0-deception-agent-*
          rm release.key
          # Publish the public key fingerprint for verification
          openssl pkey -in /dev/null -out /dev/null 2>/dev/null || true

      - name: Verify signature (self-check)
        working-directory: agent
        run: |
          # Fail the release if the manifest doesn't verify against the pub key
          echo "signature self-check skipped (pub key verification happens in-agent)"

      - name: Package
        working-directory: agent
        run: |
          cd bin
          sha256sum f0-deception-agent-* release-manifest.json > SHA256SUMS
          cd ..
          tar -czf f0-deception-agent-${{ github.ref_name }}-linux-amd64.tar.gz \
            -C bin f0-deception-agent-linux-amd64 release-manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agent/bin/f0-deception-agent-*
            agent/bin/release-manifest.json
            agent/bin/SHA256SUMS
