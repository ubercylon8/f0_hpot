name: f0-deception

x-env: &shared-env
  F0_TOKEN_DOMAINS: ${F0_TOKEN_DOMAINS:?set in .env}
  F0_GATEWAY_ORIGIN: ${F0_GATEWAY_ORIGIN:-}
  F0_GATEWAY_IP: ${F0_GATEWAY_IP:-}
  F0_API_BASE_URL: http://api:8443
  F0_MAIL_DOMAINS: ${F0_MAIL_DOMAINS:-}
  # Gateway→API shared secret (authorizes incident forwarding).
  F0_INTERNAL_SECRET: ${F0_INTERNAL_SECRET:?set in .env}

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *shared-env
      F0_API_PORT: 8443
      F0_DB_PATH: /data/f0_deception.db
      F0_MAX_ALERTS_PER_MINUTE: ${F0_MAX_ALERTS_PER_MINUTE:-1}
      F0_ADMIN_TOKEN: ${F0_ADMIN_TOKEN:?set in .env}
      F0_ENROLLMENT_TOKEN: ${F0_ENROLLMENT_TOKEN:-}
      F0_GEOIP_DB: ${F0_GEOIP_DB:-}
      F0_AGENT_RELEASE_DIR: /release-bin
    volumes:
      - api-data:/data
      # GeoIP .mmdb (optional, mounted read-only when present)
      - ./data:/geoip:ro
      # Agent release binaries (built or fetched by the installer)
      # Writable: the console's own features write here — `build binaries`
      # cross-compiles into it and code signing replaces each binary with
      # its signed copy. Mounted read-only, signing failed with EROFS.
      # Only the API mounts this; the attacker-facing gateway does not.
      - ./release-bin:/release-bin
    expose:
      - "8443"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    environment:
      <<: *shared-env
      F0_HTTP_PORT: 80
      F0_DNS_PORT: 53
      F0_SMTP_PORT: ${F0_SMTP_PORT:-2525}
    ports:
      # Attacker-facing reach-back — published on the chosen public IP.
      - "${GATEWAY_PUBLISH_IP:-0.0.0.0}:80:80"
      - "${GATEWAY_PUBLISH_IP:-0.0.0.0}:53:53/udp"
      - "${GATEWAY_PUBLISH_IP:-0.0.0.0}:${F0_SMTP_PORT:-2525}:${F0_SMTP_PORT:-2525}"

  console:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8443
      GATEWAY_ORIGIN: http://gateway:80
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Used by the token-surface TLS block (see Caddyfile).
      TOKEN_DOMAIN: ${F0_TOKEN_DOMAINS:?set in .env}
      TOKEN_TLS_MODE: ${TOKEN_TLS_MODE:-http}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Console: loopback by default (reach via ssh -L); set
      # CONSOLE_PUBLISH_IP to the public IP for public access.
      # (Private mode serves :8080; public mode serves :443 via ACME.)
      # No :80 publish — the gateway owns public :80 for token reach-backs
      # (source IPs must arrive unproxied); the console cert uses the
      # TLS-ALPN-01 challenge, which needs only :443.
      - "${CONSOLE_PUBLISH_IP:-127.0.0.1}:8080:8080"
      # Token surface HTTPS (only used when TOKEN_TLS_MODE != http) and
      # public console (when CONSOLE_PUBLISH_IP is public).
      - "${GATEWAY_PUBLISH_IP:-0.0.0.0}:443:443"

volumes:
  api-data:
  caddy-data:
  caddy-config:
